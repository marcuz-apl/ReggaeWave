name: Cross-Platform Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-24.04
            artifact_name: ReggaeWave-Linux-x86_64
            archive_file: ReggaeWave-Linux-x86_64.tar.gz

          - name: macOS (Universal)
            os: macos-latest
            artifact_name: ReggaeWave-macOS-Universal
            archive_file: ReggaeWave-macOS-Universal.zip

          - name: Windows (x64)
            os: windows-latest
            artifact_name: ReggaeWave-Windows-x64
            archive_file: ReggaeWave-Windows-x64.zip

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Swap Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libfreetype6-dev

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile ReggaeWave & Test Suite
        run: |
          cmake --build build --config Release --parallel 2

      - name: Run Test Suite (55 Tests)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          find build -type f -name "ReggaeWave" -exec cp {} dist/ \;
          tar -czf ReggaeWave-Linux-x86_64.tar.gz -C dist ReggaeWave

      - name: Package macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find build -name "ReggaeWave.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            zip -r ReggaeWave-macOS-Universal.zip "$APP_PATH"
          else
            echo "Error: ReggaeWave.app not found" && exit 1
          fi

      - name: Package Windows Executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter "ReggaeWave.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Compress-Archive -Path $exe.FullName -DestinationPath "ReggaeWave-Windows-x64.zip"
          } else {
            Write-Error "ReggaeWave.exe not found"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_file }}
          retention-days: 30

  create-github-release:
    name: Publish GitHub Release (On Tags)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReggaeWave-Linux-x86_64
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReggaeWave-macOS-Universal
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReggaeWave-Windows-x64
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
