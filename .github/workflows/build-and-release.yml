name: Cross-Platform Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-24.04
            platform_id: Linux-x86_64
            upload_path: dist/packages/*

          - name: macOS (Universal)
            os: macos-latest
            platform_id: macOS-Universal
            upload_path: dist/*

          - name: Windows (x64)
            os: windows-latest
            platform_id: Windows-x64
            upload_path: dist/*

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Version Identifier
        id: get_version
        shell: bash
        run: |
          APP_VER=$(cat VERSION | tr -d '\r\n')
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV
          echo "APP_VER=${APP_VER}" >> $GITHUB_OUTPUT

      - name: Setup Swap Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            rpm \
            dpkg-dev \
            libasound2-dev \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libfreetype6-dev

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Desktop App & Test Suite
        run: |
          cmake --build build --config Release --parallel 2

      - name: Run Test Suite (58 Tests)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux Binary (DEB & RPM)
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -G "DEB;RPM"
          mkdir -p ../dist/packages
          cp *.deb *.rpm ../dist/packages/ 2>/dev/null || true

      - name: Package macOS DMG Installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          APP_PATH=$(find build -name "ReggaeWave.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Creating macOS DMG installer from $APP_PATH..."
            hdiutil create -volname "ReggaeWave" -srcfolder "$APP_PATH" -ov -format UDZO "dist/ReggaeWave-${APP_VER}-macOS-Universal.dmg"
          else
            echo "Error: ReggaeWave.app not found" && exit 1
          fi

      - name: Package Windows Executable & NSIS Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter "ReggaeWave.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force -Path "dist"
            Copy-Item -Path $exe.FullName -Destination "dist/ReggaeWave.exe"
            
            # Locate makensis compiler
            $makensisCmd = "makensis"
            if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
              if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
                $makensisCmd = "C:\Program Files (x86)\NSIS\makensis.exe"
              } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
                $makensisCmd = "C:\Program Files\NSIS\makensis.exe"
              } else {
                Write-Host "Installing NSIS via choco..."
                choco install nsis -y
                $makensisCmd = "C:\Program Files (x86)\NSIS\makensis.exe"
              }
            }
            
            $appVer = $env:APP_VER
            $repoRoot = (Get-Location).Path
            $distDir = Join-Path $repoRoot "dist"
            $iconPath = Join-Path $repoRoot "infra\packaging\assets\reggaewave.ico"
            $nsiScript = Join-Path $repoRoot "infra\packaging\windows\installer.nsi"
            $exePath = $exe.FullName

            Write-Host "Compiling NSIS installer (version $appVer) with $makensisCmd..."
            & $makensisCmd -DPRODUCT_VERSION="$appVer" -DEXE_SOURCE="$exePath" -DICON_FILE="$iconPath" -DOUTPUT_DIR="$distDir" "$nsiScript"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "makensis failed with exit code $LASTEXITCODE"
              exit 1
            }
            
            if (Test-Path "$distDir\ReggaeWave-Setup.exe") {
              Move-Item -Path "$distDir\ReggaeWave-Setup.exe" -Destination "$distDir\ReggaeWave-$appVer-Setup.exe" -Force
              Write-Host "Successfully generated $distDir\ReggaeWave-$appVer-Setup.exe"
            } else {
              Write-Error "ReggaeWave-Setup.exe missing in $distDir"
              exit 1
            }
          } else {
            Write-Error "ReggaeWave.exe not found"
            exit 1
          }

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReggaeWave-${{ env.APP_VER }}-${{ matrix.platform_id }}
          path: ${{ matrix.upload_path }}
          retention-days: 30

  build-ios:
    name: Build iOS Mobile (Simulator Bundle)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Version Identifier
        id: get_version
        shell: bash
        run: |
          APP_VER=$(cat VERSION | tr -d '\r\n')
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV

      - name: Configure CMake for iOS Simulator
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DREGGAEWAVE_BUILD_DESKTOP=OFF \
            -DREGGAEWAVE_BUILD_TESTS=OFF \
            -DREGGAEWAVE_BUILD_MOBILE=ON

      - name: Compile iOS Target
        run: |
          cmake --build build-ios --config Release -- -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package iOS App Bundle
        run: |
          mkdir -p dist-ios
          IOS_APP=$(find build-ios -name "ReggaeWave.app" -type d | head -n 1)
          if [ -n "$IOS_APP" ]; then
            cd "$(dirname "$IOS_APP")"
            zip -r "$GITHUB_WORKSPACE/dist-ios/ReggaeWave-${APP_VER}-iOS-Simulator.zip" "$(basename "$IOS_APP")"
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReggaeWave-${{ env.APP_VER }}-iOS-Simulator
          path: dist-ios/*
          retention-days: 30

  build-android:
    name: Build Android NDK Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Version Identifier
        id: get_version
        shell: bash
        run: |
          APP_VER=$(cat VERSION | tr -d '\r\n')
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV

      - name: Install Ninja Build
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Configure and Compile Android ARM64
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          else
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk /opt/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using Android NDK at: ${NDK_PATH}"
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK="${NDK_PATH}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DREGGAEWAVE_BUILD_DESKTOP=OFF \
            -DREGGAEWAVE_BUILD_TESTS=OFF \
            -DREGGAEWAVE_BUILD_MOBILE=ON
          cmake --build build-android --config Release --parallel 2

      - name: Package Android Distribution
        run: |
          mkdir -p dist-android
          cp -r build-android/apps/mobile/ReggaeWaveMobile_artefacts/Release/* dist-android/ 2>/dev/null || true
          find build-android -name "*.so" -exec cp {} dist-android/ \; 2>/dev/null || true
          find build-android -name "*.apk" -exec cp {} dist-android/ReggaeWave-${APP_VER}-Android.apk \; 2>/dev/null || true

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReggaeWave-${{ env.APP_VER }}-Android-ARM64
          path: dist-android/*
          retention-days: 30


  create-github-release:
    name: Publish GitHub Release (On Tags)
    needs: [build-desktop, build-ios, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: ReggaeWave-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          generate_release_notes: true
