name: Cross-Platform Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-24.04
            artifact_name: ReggaeWave-Linux-Packages
            upload_path: dist/packages/*

          - name: macOS (Universal)
            os: macos-latest
            artifact_name: ReggaeWave-macOS-Universal
            upload_path: dist/ReggaeWave.dmg

          - name: Windows (x64)
            os: windows-latest
            artifact_name: ReggaeWave-Windows-x64
            upload_path: dist/*

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Swap Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            rpm \
            dpkg-dev \
            libasound2-dev \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libfreetype6-dev

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile ReggaeWave & Test Suite
        run: |
          cmake --build build --config Release --parallel 2

      - name: Run Test Suite (55 Tests)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux Binary (DEB & RPM)
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -G "DEB;RPM"
          mkdir -p ../dist/packages
          cp *.deb *.rpm ../dist/packages/

      - name: Package macOS DMG Installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          APP_PATH=$(find build -name "ReggaeWave.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Creating macOS DMG installer from $APP_PATH..."
            hdiutil create -volname "ReggaeWave" -srcfolder "$APP_PATH" -ov -format UDZO dist/ReggaeWave.dmg
          else
            echo "Error: ReggaeWave.app not found" && exit 1
          fi

      - name: Package Windows Executable & Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter "ReggaeWave.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force -Path "dist"
            Copy-Item -Path $exe.FullName -Destination "dist/ReggaeWave.exe"
            
            # Locate makensis compiler
            $makensisCmd = "makensis"
            if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
              if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
                $makensisCmd = "C:\Program Files (x86)\NSIS\makensis.exe"
              } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
                $makensisCmd = "C:\Program Files\NSIS\makensis.exe"
              } else {
                Write-Host "Installing NSIS via choco..."
                choco install nsis -y
                $makensisCmd = "C:\Program Files (x86)\NSIS\makensis.exe"
              }
            }
            
            # Read version from VERSION file
            $ver = (Get-Content VERSION -First 1).Trim()
            $semver = ($ver -replace '-.*$', '')
            Write-Host "Compiling NSIS installer (version $semver) with $makensisCmd..."
            & $makensisCmd -DPRODUCT_VERSION=$semver -DEXE_SOURCE="$($exe.FullName)" -DOUTPUT_DIR="dist" infra/packaging/windows/installer.nsi
            if ($LASTEXITCODE -ne 0) {
              Write-Error "makensis failed with exit code $LASTEXITCODE"
              exit 1
            }
            
            if (Test-Path "dist/ReggaeWave-Setup.exe") {
              Write-Host "Successfully generated dist/ReggaeWave-Setup.exe"
            } else {
              Write-Error "dist/ReggaeWave-Setup.exe missing"
              exit 1
            }
          } else {
            Write-Error "ReggaeWave.exe not found"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.upload_path }}
          retention-days: 30

  create-github-release:
    name: Publish GitHub Release (On Tags)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Packages
        uses: actions/download-artifact@v4
        with:
          name: ReggaeWave-Linux-Packages
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReggaeWave-macOS-Universal
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReggaeWave-Windows-x64
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          generate_release_notes: true

